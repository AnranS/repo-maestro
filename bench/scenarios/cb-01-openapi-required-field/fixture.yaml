id: cb-01-openapi-required-field
kind: contract-break
goal: "Detect a new required OpenAPI field that consumers must handle"
expected:
  touched_files:
    - producer/openapi.yaml
    - consumer/test_required_field.sh
  required_projects: [producer, consumer]
  required_contract_consumers: [consumer]
  forbidden_files: []
budget:
  max_runtime_secs: 60
  max_tasks: 4
tools_required: [sh]
